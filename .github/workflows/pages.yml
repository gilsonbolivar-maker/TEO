# Publica o programa no GitHub Pages a cada push nesta branch.
# O passo "configure-pages" com enablement ativa o Pages sozinho,
# sem precisar mexer nas configurações do repositório pelo navegador.
name: Publicar no GitHub Pages

on:
  push:
    branches: [claude/programa-motivacional-teo-neto-tu446x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Ativar e configurar o GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Empacotar os arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: publicacao
        uses: actions/deploy-pages@v4
